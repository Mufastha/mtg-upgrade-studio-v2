<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MTG Upgrade Studio</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    max-width: 720px;
    margin: 2rem auto;
    padding: 0 1rem;
    line-height: 1.5;
  }
  h1 { font-size: 1.4rem; }
  h2 { font-size: 1.1rem; margin-top: 2.5rem; }
  #status, #import-status, #decklist-status, #dados-status, #colecao-status, #decks-status {
    color: #666;
    margin-bottom: 1rem;
  }
  #status.erro, #import-status.erro, #decklist-status.erro, #dados-status.erro {
    color: #b00020;
  }
  input[type="search"], input[type="text"], textarea, select {
    width: 100%;
    padding: 0.5rem;
    font-size: 1rem;
    font-family: inherit;
    box-sizing: border-box;
    margin-bottom: 0.5rem;
  }
  label.checkbox { display: block; margin-bottom: 0.5rem; }
  label.checkbox input { width: auto; margin-right: 0.4rem; }
  #decklist-precon-campos { margin-left: 1.5rem; }
  textarea { font-family: ui-monospace, monospace; font-size: 0.9rem; }
  button {
    padding: 0.5rem 1rem;
    font-size: 1rem;
    margin-bottom: 1rem;
    cursor: pointer;
  }
  table { width: 100%; border-collapse: collapse; font-size: 0.9rem; margin-bottom: 1rem; }
  th, td { text-align: left; padding: 0.3rem 0.5rem; border-bottom: 1px solid #ddd; }
  td.preco { text-align: right; white-space: nowrap; }
  .desconhecido { color: #999; font-style: italic; }
</style>
</head>
<body>
  <h1>MTG Upgrade Studio</h1>
  <p id="status">A carregar catálogo…</p>
  <input type="search" id="pesquisa" placeholder="Pesquisar carta por nome…" disabled>
  <table id="resultados" hidden>
    <thead>
      <tr><th>Nome</th><th>Custo</th><th>Tipo</th><th>Preço (est.)</th></tr>
    </thead>
    <tbody id="resultados-corpo"></tbody>
  </table>

  <h2>Coleção guardada</h2>
  <input type="search" id="colecao-pesquisa" placeholder="Pesquisar na coleção por nome…">
  <p id="colecao-status"></p>
  <table id="colecao-tabela" hidden>
    <thead>
      <tr><th>Nome</th><th>Edição</th><th>Quantidade</th><th>Foil</th></tr>
    </thead>
    <tbody id="colecao-corpo"></tbody>
  </table>
  <button id="colecao-mostrar-mais" hidden>Mostrar mais</button>

  <h2>Decks guardados</h2>
  <p id="decks-status"></p>
  <table id="decks-tabela" hidden>
    <thead>
      <tr><th>Nome</th><th>Commander</th><th>Cartas</th><th>Precon</th><th></th></tr>
    </thead>
    <tbody id="decks-corpo"></tbody>
  </table>

  <h2>Importar coleção (ManaBox)</h2>
  <input type="file" id="manabox-csv" accept=".csv" disabled>
  <p id="import-status"></p>
  <table id="import-falhas" hidden>
    <thead>
      <tr><th>Linha</th><th>Nome</th><th>Edição</th><th>Nº colecionador</th></tr>
    </thead>
    <tbody id="import-falhas-corpo"></tbody>
  </table>

  <h2>Importar deck (texto)</h2>
  <textarea id="decklist-texto" rows="10" placeholder="// COMMANDER&#10;1 Cloud, Ex-SOLDIER&#10;&#10;1 Sol Ring&#10;(ou: CMDR Cloud, Ex-SOLDIER em vez do cabeçalho)" disabled></textarea>
  <input type="text" id="decklist-nome" placeholder="Nome do deck" disabled>
  <label class="checkbox">
    <input type="checkbox" id="decklist-e-precon" disabled>
    Este deck vem de um precon (§4.3) — as cartas da lista nunca aparecerão como recomendação de compra
  </label>
  <div id="decklist-precon-campos" hidden>
    <input type="text" id="decklist-precon-nome" placeholder="Nome do precon (ex. Limit Break)">
  </div>
  <button id="decklist-processar" disabled>Processar</button>
  <p id="decklist-status"></p>
  <table id="decklist-falhas" hidden>
    <thead><tr><th>Linha</th><th>Texto</th></tr></thead>
    <tbody id="decklist-falhas-corpo"></tbody>
  </table>
  <div id="decklist-commander-picker" hidden>
    <label for="decklist-commander-select">O commander não foi marcado (nem "// COMMANDER" nem "CMDR") — escolhe-o:</label>
    <select id="decklist-commander-select"></select>
  </div>
  <button id="decklist-guardar" hidden>Guardar deck</button>

  <h2>Dados pessoais</h2>
  <button id="dados-exportar" disabled>Exportar dados (JSON)</button>
  <input type="file" id="dados-importar" accept=".json" disabled>
  <p id="dados-status"></p>

  <script type="module" src="src/app.js"></script>
</body>
</html>
